name: QuickQuiz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f Dockerfile

      - name: Build Docker image
        run: docker build -t quickquiz:${{ github.sha }} .
